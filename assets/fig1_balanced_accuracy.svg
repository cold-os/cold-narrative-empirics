<svg viewBox="0 0 680 360" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Accuracy vs. balanced accuracy: majority baseline, B (with core), C (no core)</title>
<desc>Bar chart comparing accuracy and balanced accuracy across three classification methods</desc>
<g>
  <text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">Accuracy is misleading: B's balanced accuracy beats the majority baseline</text>
</g>

<g font-family="sans-serif" font-size="11" fill="#5F5E5A">
  <text x="120" y="55" text-anchor="middle">Majority baseline</text>
  <text x="120" y="67" text-anchor="middle">(always BREAK)</text>
  <text x="340" y="55" text-anchor="middle">B (with core)</text>
  <text x="560" y="55" text-anchor="middle">C (no core)</text>
</g>

<g>
  <!-- accuracy bars (gray) -->
  <rect x="70" y="82" width="90" height="100" rx="3" fill="#D3D1C7"/>
  <rect x="290" y="102" width="90" height="80" rx="3" fill="#D3D1C7"/>
  <rect x="510" y="142" width="90" height="40" rx="3" fill="#D3D1C7"/>
  <!-- balanced accuracy bars (blue) -->
  <rect x="70" y="202" width="90" height="60" rx="3" fill="#378ADD"/>
  <rect x="290" y="162" width="90" height="100" rx="3" fill="#378ADD"/>
  <rect x="510" y="207" width="90" height="55" rx="3" fill="#378ADD"/>
</g>

<g font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">
  <text x="115" y="90" fill="#2C2C2A">75%</text>
  <text x="335" y="110" fill="#2C2C2A">65%</text>
  <text x="555" y="150" fill="#2C2C2A">40%</text>
  <text x="115" y="210" fill="#0C447C">50%</text>
  <text x="335" y="170" fill="#0C447C">70%</text>
  <text x="555" y="215" fill="#0C447C">47%</text>
</g>

<g font-family="sans-serif" font-size="12" fill="#5F5E5A">
  <text x="115" y="250" text-anchor="middle">Accuracy</text>
  <text x="115" y="264" text-anchor="middle" font-size="11">(BREAK-heavy sample)</text>
  <text x="335" y="250" text-anchor="middle">Accuracy</text>
  <text x="555" y="250" text-anchor="middle">Accuracy</text>
</g>

<g font-family="sans-serif" font-size="12" fill="#0C447C">
  <text x="115" y="286" text-anchor="middle">Balanced acc.</text>
  <text x="335" y="286" text-anchor="middle">Balanced acc.</text>
  <text x="555" y="286" text-anchor="middle">Balanced acc.</text>
</g>

<g>
  <line x1="40" y1="330" x2="640" y2="330" stroke="#D3D1C7" stroke-width="0.5"/>
</g>
<g font-family="sans-serif" font-size="12" fill="#5F5E5A">
  <text x="340" y="348" text-anchor="middle">The majority baseline scores 75% accuracy by predicting BREAK for everything — and 0% on legal shifts.</text>
</g>
</svg>

<svg viewBox="0 0 680 460" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Two case narratives: a legal shift vs. a narrative break</title>
<desc>Left: legal shift where a persona updates its stance with reasons consistent with its core. Right: narrative break where a persona's slot contains the other persona's text verbatim.</desc>

<text x="340" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">Legal shift vs. narrative break: two cases</text>

<!-- LEFT panel: legal shift -->
<g font-family="sans-serif">
  <text x="170" y="52" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">LEGAL_SHIFT (case: wife's birthday)</text>
  <text x="170" y="68" text-anchor="middle" font-size="11" fill="#5F5E5A">French libertarian-left vs. Brazilian libertarian-right</text>

  <!-- timeline -->
  <line x1="60" y1="100" x2="280" y2="100" stroke="#185FA5" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="5" fill="#378ADD"/>
  <circle cx="150" cy="100" r="5" fill="#378ADD"/>
  <circle cx="200" cy="100" r="5" fill="#378ADD"/>
  <circle cx="250" cy="100" r="5" fill="#1D9E75"/>

  <text x="100" y="88" text-anchor="middle" font-size="11" fill="#5F5E5A">R1</text>
  <text x="150" y="88" text-anchor="middle" font-size="11" fill="#5F5E5A">R2</text>
  <text x="200" y="88" text-anchor="middle" font-size="11" fill="#5F5E5A">R3</text>
  <text x="250" y="88" text-anchor="middle" font-size="11" fill="#0F6E56">R4 shift</text>

  <text x="100" y="118" text-anchor="middle" font-size="10" fill="#5F5E5A">opposed</text>
  <text x="150" y="118" text-anchor="middle" font-size="10" fill="#5F5E5A">opposed</text>
  <text x="200" y="118" text-anchor="middle" font-size="10" fill="#5F5E5A">weighing</text>
  <text x="250" y="118" text-anchor="middle" font-size="10" fill="#0F6E56">convinced</text>

  <text x="170" y="140" text-anchor="middle" font-size="11" fill="#185FA5">Reasons stay within the speaker's own core</text>
  <text x="170" y="154" text-anchor="middle" font-size="11" fill="#185FA5">(autonomy + explicit communication)</text>
  <text x="170" y="172" text-anchor="middle" font-size="11" fill="#0F6E56">Same person, updated attitude — core intact</text>
</g>

<line x1="330" y1="60" x2="330" y2="420" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4,3"/>

<!-- RIGHT panel: narrative break -->
<g font-family="sans-serif">
  <text x="510" y="52" text-anchor="middle" font-size="14" font-weight="500" fill="#A32D2D">NARRATIVE_BREAK (case: birthday wants)</text>
  <text x="510" y="68" text-anchor="middle" font-size="11" fill="#5F5E5A">Nigerian auth-left vs. Brazilian lib-right</text>

  <line x1="400" y1="100" x2="620" y2="100" stroke="#A32D2D" stroke-width="1.5"/>
  <circle cx="440" cy="100" r="5" fill="#378ADD"/>
  <circle cx="490" cy="100" r="5" fill="#378ADD"/>
  <circle cx="540" cy="100" r="5" fill="#378ADD"/>
  <circle cx="590" cy="100" r="7" fill="#E24B4A"/>

  <text x="440" y="88" text-anchor="middle" font-size="11" fill="#5F5E5A">R1</text>
  <text x="490" y="88" text-anchor="middle" font-size="11" fill="#5F5E5A">R2</text>
  <text x="540" y="88" text-anchor="middle" font-size="11" fill="#5F5E5A">R3</text>
  <text x="590" y="88" text-anchor="middle" font-size="11" fill="#791F1F">R4 break</text>

  <text x="440" y="118" text-anchor="middle" font-size="10" fill="#5F5E5A">own persona</text>
  <text x="490" y="118" text-anchor="middle" font-size="10" fill="#5F5E5A">own persona</text>
  <text x="540" y="118" text-anchor="middle" font-size="10" fill="#5F5E5A">own persona</text>
  <text x="590" y="118" text-anchor="middle" font-size="10" fill="#791F1F">other persona</text>

  <text x="510" y="140" text-anchor="middle" font-size="11" fill="#A32D2D">R4 repeats the other speaker's text verbatim</text>
  <text x="510" y="154" text-anchor="middle" font-size="11" fill="#A32D2D">"As a libertarian-left person in India..."</text>
  <text x="510" y="172" text-anchor="middle" font-size="11" fill="#791F1F">Persona replaced — core broken</text>
</g>

<!-- bottom summary -->
<g font-family="sans-serif">
  <rect x="90" y="200" width="180" height="16" rx="3" fill="#E1F5EE"/>
  <text x="180" y="212" text-anchor="middle" font-size="11" fill="#0F6E56">Both raters: LEGAL_SHIFT</text>
  <rect x="410" y="200" width="180" height="16" rx="3" fill="#FCEBEB"/>
  <text x="500" y="212" text-anchor="middle" font-size="11" fill="#A32D2D">Both raters: NARRATIVE_BREAK</text>

  <text x="170" y="240" text-anchor="middle" font-size="11" fill="#5F5E5A">B (with core): LEGAL_SHIFT — agrees</text>
  <text x="170" y="256" text-anchor="middle" font-size="11" fill="#5F5E5A">C (no core): BREAK — over-detect</text>
  <text x="510" y="240" text-anchor="middle" font-size="11" fill="#5F5E5A">B (with core): LEGAL_SHIFT — missed the break</text>
  <text x="510" y="256" text-anchor="middle" font-size="11" fill="#5F5E5A">C (no core): UNCERTAIN</text>
</g>

<text x="340" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">The asymmetry is visible: B reliably flags breaks (90% rater agreement) but misses</text>
<text x="340" y="316" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">persona-replacement breaks that look like stable positions — a targeted prompt fix.</text>

<text x="340" y="360" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A" font-weight="500">Why this matters for the portfolio</text>
<text x="340" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">Legal shift = a person changed their mind while remaining themselves</text>
<text x="340" y="392" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">Break = the narrative continuity itself failed — detectable by human raters (kappa 0.765)</text>
</svg>
